<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Star Catcher — a tiny game built from one prompt</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0e0a1f; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; background: #14102e; touch-action: none; }
  #hint { position: fixed; left: 0; right: 0; bottom: 10px; text-align: center;
          color: rgba(255,255,255,0.45); font: 13px system-ui, sans-serif; pointer-events: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hint">Move with mouse, touch, or arrow keys &middot; Space to start</div>
<script>
(function () {
  'use strict';

  // Star Catcher: catch the falling stars in your basket.
  // Built from one prompt: "Build a tiny browser game: catch falling
  // stars in a basket — move with arrow keys or mouse, 3 misses and
  // it's over, beat your best score."

  var LOGICAL_W = 540, LOGICAL_H = 960;
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var params = new URLSearchParams(location.search);
  var AUTO = params.get('auto') === '1';

  // Seeded random so autoplay demos are reproducible frame for frame.
  var seed = 1337;
  function rng() {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  function rand(a, b) { return a + (AUTO ? rng() : Math.random()) * (b - a); }
  function pick(arr) { return arr[Math.floor(rand(0, arr.length))]; }

  var scale = 1;
  function fit() {
    var w = window.innerWidth, h = window.innerHeight;
    var s = Math.min(w / LOGICAL_W, h / LOGICAL_H);
    canvas.style.width = Math.floor(LOGICAL_W * s) + 'px';
    canvas.style.height = Math.floor(LOGICAL_H * s) + 'px';
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(LOGICAL_W * s * dpr);
    canvas.height = Math.floor(LOGICAL_H * s * dpr);
    scale = s * dpr;
  }
  window.addEventListener('resize', fit);
  fit();

  // Background stars, placed once with the seeded rng.
  var skyStars = [];
  for (var i = 0; i < 90; i++) {
    skyStars.push({ x: rand(0, LOGICAL_W), y: rand(0, LOGICAL_H),
                    r: rand(0.6, 1.8), p: rand(0, Math.PI * 2), s: rand(0.5, 1.6) });
  }

  var state = 'title'; // title | playing | over
  var score = 0, best = 0, lives = 3, streak = 0;
  var stars = [], sparks = [], floats = [];
  var spawnTimer = 0, elapsed = 0;
  var basket = { x: LOGICAL_W / 2, w: 120, h: 30, target: LOGICAL_W / 2 };
  var keys = {};

  try { best = parseInt(localStorage.getItem('starCatcherBest') || '0', 10) || 0; }
  catch (e) { best = 0; }

  function startGame() {
    score = 0; lives = 3; streak = 0; elapsed = 0;
    stars = []; sparks = []; floats = []; spawnTimer = 0.2;
    basket.x = LOGICAL_W / 2; basket.target = LOGICAL_W / 2;
    state = 'playing';
  }

  function fallSpeed() { return 210 + Math.min(score * 1.6, 330); }

  function spawnStar() {
    var golden = rand(0, 1) < 0.14;
    stars.push({
      x: rand(30, LOGICAL_W - 30), y: -30,
      vy: fallSpeed() * rand(0.85, 1.2),
      sway: rand(0, Math.PI * 2), swayAmp: rand(8, 26), swaySpeed: rand(1.2, 2.6),
      r: golden ? 22 : rand(13, 17), golden: golden, rot: rand(0, Math.PI)
    });
  }

  function burst(x, y, color, n) {
    for (var i = 0; i < n; i++) {
      var a = rand(0, Math.PI * 2), v = rand(60, 260);
      sparks.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60,
                    life: rand(0.35, 0.7), age: 0, color: color, r: rand(2, 5) });
    }
  }

  function catchStar(star) {
    var pts = star.golden ? 25 : 10;
    score += pts; streak += 1;
    if (streak > 0 && streak % 5 === 0) {
      score += 25;
      floats.push({ x: star.x, y: star.y - 20, text: 'STREAK x' + (streak / 5) + '  +25',
                    age: 0, life: 1.1, color: '#ff5fa2', size: 26 });
    } else {
      floats.push({ x: star.x, y: star.y - 10, text: '+' + pts,
                    age: 0, life: 0.8, color: star.golden ? '#ffd166' : '#ffffff', size: 24 });
    }
    burst(star.x, star.y, star.golden ? '#ffd166' : '#ffe9a8', star.golden ? 22 : 12);
    if (score > best) { best = score; try { localStorage.setItem('starCatcherBest', String(best)); } catch (e) {} }
  }

  function missStar(star) {
    lives -= 1; streak = 0;
    floats.push({ x: star.x, y: LOGICAL_H - 90, text: 'MISS',
                  age: 0, life: 0.9, color: '#ff5f6d', size: 26 });
    burst(star.x, LOGICAL_H - 40, '#ff5f6d', 10);
    if (lives <= 0) { state = 'over'; }
  }

  function update(dt) {
    if (state !== 'playing') return;
    elapsed += dt;

    if (keys.ArrowLeft || keys.a) basket.target -= 520 * dt;
    if (keys.ArrowRight || keys.d) basket.target += 520 * dt;
    basket.target = Math.max(basket.w / 2, Math.min(LOGICAL_W - basket.w / 2, basket.target));

    if (AUTO) {
      var lowest = null;
      for (var i = 0; i < stars.length; i++) {
        if (!lowest || stars[i].y > lowest.y) lowest = stars[i];
      }
      if (lowest) basket.target = lowest.x;
    }
    basket.x += (basket.target - basket.x) * Math.min(1, dt * 14);

    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnStar();
      spawnTimer = Math.max(0.42, 0.95 - score * 0.004);
    }

    var basketTop = LOGICAL_H - 110;
    for (var j = stars.length - 1; j >= 0; j--) {
      var s = stars[j];
      s.y += s.vy * dt;
      s.x += Math.sin(elapsed * s.swaySpeed + s.sway) * s.swayAmp * dt;
      s.rot += dt * 1.5;
      if (s.y >= basketTop && s.y <= basketTop + 46 &&
          Math.abs(s.x - basket.x) < basket.w / 2 + 6) {
        stars.splice(j, 1); catchStar(s); continue;
      }
      if (s.y > LOGICAL_H - 20) { stars.splice(j, 1); missStar(s); }
    }

    for (var k = sparks.length - 1; k >= 0; k--) {
      var p = sparks[k];
      p.age += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 420 * dt;
      if (p.age >= p.life) sparks.splice(k, 1);
    }
    for (var m = floats.length - 1; m >= 0; m--) {
      floats[m].age += dt;
      if (floats[m].age >= floats[m].life) floats.splice(m, 1);
    }
  }

  function drawSparkle(x, y, r, rot, color) {
    ctx.save();
    ctx.translate(x, y); ctx.rotate(rot);
    ctx.fillStyle = color;
    ctx.shadowColor = color; ctx.shadowBlur = 16;
    ctx.beginPath();
    for (var i = 0; i < 8; i++) {
      var ang = (Math.PI / 4) * i;
      var rad = (i % 2 === 0) ? r : r * 0.42;
      var px = Math.cos(ang) * rad, py = Math.sin(ang) * rad;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y); ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h - r); ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
    ctx.lineTo(x + r, y + h); ctx.arcTo(x, y + h, x, y + h - r, r);
    ctx.lineTo(x, y + r); ctx.arcTo(x, y, x + r, y, r);
    ctx.closePath();
  }

  function drawHeart(x, y, s, filled) {
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    ctx.beginPath();
    ctx.moveTo(0, 6);
    ctx.bezierCurveTo(-11, -4, -6, -14, 0, -7);
    ctx.bezierCurveTo(6, -14, 11, -4, 0, 6);
    ctx.closePath();
    ctx.fillStyle = filled ? '#ff5f8f' : 'rgba(255,255,255,0.18)';
    ctx.fill();
    ctx.restore();
  }

  function draw() {
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    var g = ctx.createLinearGradient(0, 0, 0, LOGICAL_H);
    g.addColorStop(0, '#171233'); g.addColorStop(0.6, '#241b4d'); g.addColorStop(1, '#2d1a4e');
    ctx.fillStyle = g; ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);

    // Moon.
    ctx.save();
    ctx.fillStyle = '#fdf6d8'; ctx.shadowColor = '#fdf6d8'; ctx.shadowBlur = 40;
    ctx.beginPath(); ctx.arc(LOGICAL_W - 86, 92, 34, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    // Twinkling sky stars.
    var t = elapsed;
    for (var i = 0; i < skyStars.length; i++) {
      var st = skyStars[i];
      var tw = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * st.s + st.p));
      ctx.fillStyle = 'rgba(255,255,255,' + tw.toFixed(2) + ')';
      ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2); ctx.fill();
    }

    // Ground glow.
    ctx.fillStyle = 'rgba(196,28,131,0.25)';
    ctx.fillRect(0, LOGICAL_H - 26, LOGICAL_W, 26);

    for (var j = 0; j < stars.length; j++) {
      var s = stars[j];
      drawSparkle(s.x, s.y, s.r, s.rot, s.golden ? '#ffd166' : '#ffe9a8');
      if (s.golden) {
        ctx.strokeStyle = 'rgba(255,209,102,0.7)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r + 9, 0, Math.PI * 2); ctx.stroke();
      }
    }

    for (var k = 0; k < sparks.length; k++) {
      var p = sparks[k];
      ctx.globalAlpha = 1 - p.age / p.life;
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Basket.
    var bx = basket.x - basket.w / 2, by = LOGICAL_H - 110;
    ctx.save();
    ctx.shadowColor = '#c41c83'; ctx.shadowBlur = 24;
    ctx.fillStyle = '#c41c83';
    roundRect(bx, by, basket.w, basket.h, 12); ctx.fill();
    ctx.restore();
    ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 3;
    roundRect(bx + 2, by + 2, basket.w - 4, basket.h - 4, 10); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.fillRect(bx + 14, by + 8, basket.w - 28, 5);

    for (var m = 0; m < floats.length; m++) {
      var f = floats[m];
      ctx.globalAlpha = 1 - f.age / f.life;
      ctx.font = 'bold ' + f.size + 'px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = f.color;
      ctx.fillText(f.text, f.x, f.y - f.age * 40);
    }
    ctx.globalAlpha = 1;

    // HUD.
    ctx.textAlign = 'left'; ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 30px system-ui, sans-serif';
    ctx.fillText('SCORE ' + score, 22, 52);
    ctx.textAlign = 'right';
    ctx.fillStyle = 'rgba(255,255,255,0.65)';
    ctx.font = '600 22px system-ui, sans-serif';
    ctx.fillText('BEST ' + best, LOGICAL_W - 22, 48);
    for (var h = 0; h < 3; h++) drawHeart(LOGICAL_W / 2 - 30 + h * 30, 44, 1.5, h < lives);

    if (state === 'title') {
      ctx.fillStyle = 'rgba(10,6,28,0.55)'; ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
      ctx.textAlign = 'center'; ctx.fillStyle = '#ffd166';
      ctx.font = 'bold 64px system-ui, sans-serif';
      ctx.fillText('STAR', LOGICAL_W / 2, LOGICAL_H / 2 - 120);
      ctx.fillText('CATCHER', LOGICAL_W / 2, LOGICAL_H / 2 - 52);
      ctx.fillStyle = '#ffffff'; ctx.font = '28px system-ui, sans-serif';
      ctx.fillText('Catch the falling stars.', LOGICAL_W / 2, LOGICAL_H / 2 + 10);
      ctx.fillText('Three misses and it is over.', LOGICAL_W / 2, LOGICAL_H / 2 + 50);
      ctx.fillStyle = '#ff5fa2'; ctx.font = 'bold 26px system-ui, sans-serif';
      ctx.fillText(AUTO ? 'AUTOPLAY DEMO' : 'CLICK OR PRESS SPACE TO PLAY', LOGICAL_W / 2, LOGICAL_H / 2 + 130);
    }

    if (state === 'over') {
      ctx.fillStyle = 'rgba(10,6,28,0.6)'; ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
      ctx.textAlign = 'center'; ctx.fillStyle = '#ff5f6d';
      ctx.font = 'bold 56px system-ui, sans-serif';
      ctx.fillText('GAME OVER', LOGICAL_W / 2, LOGICAL_H / 2 - 60);
      ctx.fillStyle = '#ffffff'; ctx.font = 'bold 40px system-ui, sans-serif';
      ctx.fillText('Score ' + score, LOGICAL_W / 2, LOGICAL_H / 2 + 6);
      ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.font = '26px system-ui, sans-serif';
      ctx.fillText('Best ' + best, LOGICAL_W / 2, LOGICAL_H / 2 + 50);
      ctx.fillStyle = '#ff5fa2'; ctx.font = 'bold 24px system-ui, sans-serif';
      ctx.fillText(AUTO ? 'AUTOPLAY DEMO' : 'CLICK OR PRESS SPACE TO RETRY', LOGICAL_W / 2, LOGICAL_H / 2 + 120);
    }
  }

  function pointerX(clientX) {
    var rect = canvas.getBoundingClientRect();
    return (clientX - rect.left) / rect.width * LOGICAL_W;
  }

  canvas.addEventListener('pointermove', function (e) {
    if (state !== 'playing' || AUTO) return;
    basket.target = pointerX(e.clientX);
  });
  canvas.addEventListener('pointerdown', function (e) {
    if (state !== 'playing' && !AUTO) { startGame(); return; }
    if (state === 'playing' && !AUTO) basket.target = pointerX(e.clientX);
  });
  window.addEventListener('keydown', function (e) {
    keys[e.key] = true;
    if ((e.key === ' ' || e.key === 'Enter') && state !== 'playing' && !AUTO) { e.preventDefault(); startGame(); }
  });
  window.addEventListener('keyup', function (e) { keys[e.key] = false; });

  var last = null;
  function frame(ts) {
    if (last === null) last = ts;
    var dt = Math.min((ts - last) / 1000, 0.05);
    last = ts;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  if (AUTO) {
    startGame();
    // The hint bar is for human players; hide it in autoplay demos.
    var hint = document.getElementById('hint');
    if (hint) hint.style.display = 'none';
  }
})();
</script>
</body>
</html>
